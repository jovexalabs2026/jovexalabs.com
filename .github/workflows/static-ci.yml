name: Static release CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [release/digital2030-static]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          STATIC_HOST: github
      - run: npm run build:pages
      - run: npm run test:e2e
